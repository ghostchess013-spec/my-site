<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0b0b0b;
    color: #e8e8e8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.6;
  }
  .card {
    max-width: 520px;
    width: 100%;
  }
  h1 {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .sub {
    color: #7a7a7a;
    font-size: 14px;
    margin-bottom: 32px;
    font-family: ui-monospace, 'SF Mono', monospace;
  }
  p {
    color: #b8b8b8;
    font-size: 15px;
    margin-bottom: 16px;
  }
  .links {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid #1e1e1e;
    display: flex;
    gap: 20px;
    font-size: 14px;
  }
  a {
    color: #22c55e;
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <h1>Titan</h1>
    <div class="sub">titan-arrow</div>
    <p>Personal workspace. Software and tools I build and use.</p>
    <p>Nothing hosted here — just a landing page.</p>
    <div class="links">
      <a href="https://github.com/USERNAME">GitHub</a>
    </div>
  </div>
</body>
</html>
